  <g id="background">
    <rect width="1024" height="1024" fill="url(#background-base)"/>
    <rect width="1024" height="1024" fill="url(#background-warmth)"/>
    <ellipse cx="512" cy="180" rx="430" ry="320" fill="url(#top-warmth)"/>
    <ellipse cx="512" cy="385" rx="430" ry="360" fill="url(#microphone-ambience)"/>
    <ellipse cx="512" cy="790" rx="500" ry="205" fill="url(#wordmark-ambience)"/>
  </g>

  <g id="microphone" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g id="microphone-wide-glow" stroke="#E94B0B" stroke-width="48" opacity="0.38" filter="url(#glow-wide)">
      <use xlink:href="#microphone-lines"/>
    </g>
    <g id="microphone-tight-glow" stroke="#FF7208" stroke-width="34" opacity="0.88" filter="url(#glow-tight)">
      <use xlink:href="#microphone-lines"/>
    </g>
    <g id="microphone-orange-edge" stroke="#FA6C03" stroke-width="25">
      <use xlink:href="#microphone-lines"/>
    </g>
    <g id="microphone-cream-core" stroke="#FFFCC2" stroke-width="14">
      <use xlink:href="#microphone-lines"/>
    </g>
  </g>

  <g id="wordmark" transform="translate(78 670) scale(1.015 1.18)" stroke-linejoin="round">
    <use xlink:href="#voicevault-wordmark" fill="#E94B0B" stroke="#E94B0B" stroke-width="26" opacity="0.42" filter="url(#glow-wide)"/>
    <use xlink:href="#voicevault-wordmark" fill="#FF7208" stroke="#FF7208" stroke-width="13" opacity="0.68" filter="url(#glow-tight)"/>
    <use xlink:href="#voicevault-wordmark" fill="#FFFCC2" stroke="#FA6C03" stroke-width="6"/>
  </g>
</svg>
