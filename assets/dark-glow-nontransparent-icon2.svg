<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">VoiceVault glowing dark app icon</title>
  <desc id="desc">Editable vector artwork matching the dark VoiceVault icon, with a glowing microphone, sound waves, and outlined VoiceVault wordmark.</desc>

  <defs>
    <linearGradient id="background-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#211F26"/>
      <stop offset="0.48" stop-color="#2A2025"/>
      <stop offset="1" stop-color="#211F25"/>
    </linearGradient>
    <radialGradient id="background-warmth" gradientUnits="userSpaceOnUse" cx="512" cy="455" r="690">
      <stop offset="0" stop-color="#A44325" stop-opacity="0.75"/>
      <stop offset="0.38" stop-color="#713027" stop-opacity="0.52"/>
      <stop offset="0.72" stop-color="#42252A" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#211F25" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="top-warmth" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8B3929" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#67302A" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#42252A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="microphone-ambience" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF6A16" stop-opacity="0.16"/>
      <stop offset="0.46" stop-color="#FF5720" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FF4A18" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wordmark-ambience" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF6316" stop-opacity="0.40"/>
      <stop offset="0.45" stop-color="#FF4F1A" stop-opacity="0.28"/>
      <stop offset="0.72" stop-color="#FF4F1A" stop-opacity="0.09"/>
      <stop offset="0.90" stop-color="#FF4F1A" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FF4A18" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow-wide" x="-55%" y="-55%" width="210%" height="210%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="glow-tight" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <g id="microphone-lines" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M424 210 C424 151 462 119 512 119 C562 119 600 151 600 210 Z"/>
      <path d="M425 257 H599 V394 C599 449 563 479 512 479 C461 479 425 449 425 394 Z"/>
      <path d="M380 321 V397 C380 478 436 522 512 522 C588 522 644 478 644 397 V321"/>
      <path d="M512 524 V638 M398 638 H626"/>
      <path d="M320 246 C249 316 249 401 320 471"/>
      <path d="M266 198 C170 291 170 425 266 519"/>
      <path d="M704 246 C775 316 775 401 704 471"/>
      <path d="M758 198 C854 291 854 425 758 519"/>
    </g>

