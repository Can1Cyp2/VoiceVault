  .screen {

  /* Clean status bar over the screenshot's (hides the alarm Live Activity) */

<script>
  // Build the phone body: back plate, a stack of slices for thickness (with
  // side buttons protruding from the middle slices), then the glass face.
  const phone = document.getElementById("phone");
  const DEPTH = 110, STEP = 2;
  const html = [];
  html.push(`<div class="layer back" style="transform:translateZ(${-DEPTH}px)"></div>`);
  for (let z = -DEPTH + STEP; z < 0; z += STEP) {
    const edge = z > -10 || z < -DEPTH + 10;
    const mid = z > -DEPTH * 0.72 && z < -DEPTH * 0.28;
    const buttons = mid
      ? `<div class="btn" style="left:-9px; top:330px; height:70px"></div>
         <div class="btn" style="left:-9px; top:450px; height:130px"></div>
         <div class="btn" style="left:-9px; top:610px; height:130px"></div>
         <div class="btn" style="right:-9px; top:500px; height:200px"></div>`
      : "";
    html.push(`<div class="layer slice${edge ? " edge" : ""}" style="transform:translateZ(${z}px)">${buttons}</div>`);
  }
  html.push(`<div class="layer face" style="transform:translateZ(0)"><div class="screen"><div class="statusbar"><span>2:19</span><div class="island"></div><span class="icons"><svg width="36" height="24" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#fff"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#fff"/><rect x="10" y="3" width="3" height="9" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#fff"/></svg><svg width="34" height="24" viewBox="0 0 17 12"><path d="M8.5,11.5 L5.6,8.4 A4.2,4.2 0 0 1 11.4,8.4 Z" fill="#fff"/><path d="M3.4,6.2 A7.3,7.3 0 0 1 13.6,6.2" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><path d="M1,3.6 A10.8,10.8 0 0 1 16,3.6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg><svg width="54" height="26" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="#fff" stroke-opacity="0.5"/><rect x="2.5" y="2.5" width="15" height="8" rx="2" fill="#fff"/><rect x="24.5" y="4.5" width="2" height="4" rx="1" fill="#fff" fill-opacity="0.5"/></svg></span></div><div class="glare"></div></div></div>`);
  html.push(`<div class="pop-shadow"></div>`);
  html.push(`<div class="pop"><div class="pop-sheen"></div></div>`);
  phone.innerHTML = html.join("");
</script>
